name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the production floor (8.2), the primary shared-hosting target
        # (8.3), VPS runtime (8.4), and PHP 8.5.
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pdo_mysql, intl, gd, bcmath, exif, redis
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security audit (dependencies)
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test

      - name: Validate Docker/VPS compose
        if: matrix.php == '8.3'
        run: docker compose -f docker-compose.vps.yml config >/dev/null

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  postgres-rollback:
    name: PostgreSQL 16 snapshot and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testocms_p1_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, pdo_pgsql, intl, gd, bcmath, exif
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Restore schema/data/sequences and recover interrupted rename
        env:
          CMS_RUN_DESTRUCTIVE_PG_TESTS: '1'
          CMS_PGSQL_TEST_DATABASE: testocms_p1_ci
          CMS_PGSQL_TEST_PASSWORD: disposable-ci-password
        run: PATH=/usr/lib/postgresql/16/bin:$PATH php vendor/bin/phpunit tests/Integration/PostgresSnapshotIntegrationTest.php

  mysql-content:
    name: MySQL 8 content transitions
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testocms_p2_ci
          MYSQL_ROOT_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -pdisposable-ci-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, pdo_mysql, intl, gd, bcmath, exif, redis
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Verify content, permissions, translations and schedules
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: testocms_p2_ci
          DB_USERNAME: root
          DB_PASSWORD: disposable-ci-password
        run: |
          php vendor/bin/phpunit tests/Feature/AdminPublicationPermissionsTest.php tests/Feature/AdminTranslationPatchTest.php tests/Feature/UserAccessRevocationTest.php tests/Feature/PublicationSafetyTest.php tests/Feature/ContentWorkflowActionsTest.php tests/Feature/CategoryMutationSafetyTest.php tests/Feature/AssetDeletionSafetyTest.php tests/Feature/PublicContentCorrectnessTest.php
          CMS_MUTATION_TEST_CONNECTION=mysql CMS_RUN_MUTATION_CONCURRENCY_TESTS=1 CMS_MUTATION_TEST_DATABASE=testocms_p2_ci CMS_MUTATION_TEST_HOST=127.0.0.1 CMS_MUTATION_TEST_PORT=3306 CMS_MUTATION_TEST_USERNAME=root CMS_MUTATION_TEST_PASSWORD=disposable-ci-password php vendor/bin/phpunit tests/Feature/ContentMutationConcurrencyTest.php

  runtime-storage:
    name: File and Redis cache/session integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, intl, gd, bcmath, exif, redis
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Verify cache HIT, publication invalidation, preview expiry and persisted session revocation
        env:
          CMS_RUN_RUNTIME_STORAGE_TESTS: '1'
          REDIS_HOST: 127.0.0.1
        run: php vendor/bin/phpunit tests/Integration/RuntimeStorageIntegrationTest.php

  postgres-content:
    name: PostgreSQL 16 content and mutation races
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testocms_p2_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, pdo_pgsql, intl, gd, bcmath, exif
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Verify committed content and concurrent references/tree changes
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testocms_p2_ci
          DB_USERNAME: postgres
          DB_PASSWORD: disposable-ci-password
          CMS_MUTATION_TEST_CONNECTION: pgsql
          CMS_RUN_MUTATION_CONCURRENCY_TESTS: '1'
          CMS_MUTATION_TEST_DATABASE: testocms_p2_ci
          CMS_MUTATION_TEST_HOST: 127.0.0.1
          CMS_MUTATION_TEST_USERNAME: postgres
          CMS_MUTATION_TEST_PASSWORD: disposable-ci-password
        run: |
          php vendor/bin/phpunit tests/Feature/CategoryMutationSafetyTest.php tests/Feature/AssetDeletionSafetyTest.php tests/Feature/PublicContentCorrectnessTest.php tests/Feature/AdminTranslationPatchTest.php tests/Feature/PublicationSafetyTest.php
          php vendor/bin/phpunit tests/Feature/ContentMutationConcurrencyTest.php
