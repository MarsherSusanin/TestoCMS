name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the production floor (8.2), the primary shared-hosting target
        # (8.3) and the latest supported runtime (8.4).
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pdo_mysql, intl, gd, bcmath, exif
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security audit (dependencies)
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test

      - name: Validate Docker/VPS compose
        if: matrix.php == '8.3'
        run: docker compose -f docker-compose.vps.yml config >/dev/null

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
